entities:
  rep:
    table: sales_hierarchy_nodes
    code_column: Code
    name_column: Name
    id_column: Id
  customer:
    table: sales_flat
    code_column: CustomerCode
    name_column: CustomerName
  product:
    table: sales_flat
    code_column: ProductCode
    name_column: ProductName
  route:
    table: sales_flat
    code_column: Route
    name_column: Route
  brand:
    table: sales_flat
    code_column: Brand
    name_column: Brand

schema_cards:
  sales_flat: "Invoice lines. Grain: one product line. Columns: Date, InvoiceNo, ProductCode, ProductName, Productid, Qty, Discount, NetValue, Brand, CustomerCategory, ProductCategory, Route, RepId, RepCode, RepName, CustomerCode, CustomerName, ASM, RSM, TerritoryCode, TerritoryName, Distributor, Type ('sales'|'return'), Reason, TownId, TownName, agencyName, agencyCode. Amount column is NetValue. Route here is the route name already on the line, not routes.Id."
  sales_targets: "Assigned targets. Columns: Id, Value, Qty, Type (1=rep), IsRep, IsProduct, IsCustomer, IsBrand, IsCategory, StartDate, EndDate, Month, Year, RepId, CustomerId, ProductId, BrandId, CategoryId, TerritoryId, PeriodId. Never join this raw table to sales_flat. Aggregate each fact in its own CTE first."
  sales_hierarchy_nodes: "Rep and territory dimension. Columns: Id, Code, Name, Active, ParentId, LevelType, IsTerritory, DistributorId, CompanyId. RLS is always FIND_IN_SET(shn.Code, @AllowedNodes) > 0. Never filter with sf.RepCode = @RepCode."
  external_parties: "Customer and distributor master. Columns: Id, Code, Name, Active, Type (0=Customer, 1=Supplier, 2=Distributor), SalesHierarchyNodeId, RepId, RouteId, TerritoryId, TownId, MobileNo, City. Join sf.CustomerCode = ep.Code. Do not join ep.Id to sales_flat.CustomerCode."
  products: "Product master. Columns: Id, Code, Name, Active, PackSize, Volume, CategoryId, SubCategoryId, BrandId, IsAvailableToSFA. Join sf.ProductCode = p.Code. Productid on sales_flat matches products.Id when it is populated."
  routes: "Route master. Columns: Id, Code, Name, IsActive, RepId, TerritoryId, SubTerritoryId, BranchId, CompanyId. Join routes.RepId = shn.Id. sales_flat.Route is a name, so match it with routes.Name or routes.Code, not routes.Id."
  planned_routes: "Planned visits. Columns: Id, PlannedDate, RouteId, RepId, IsDeleted, ApprovalStatus. Join pr.RepId = shn.Id and pr.RouteId = routes.Id. Ignore rows with IsDeleted = 1."
  route_customer_assignments: "Customers on a route. Columns: Id, SeqNo, RouteId, CustomerId. Join rca.RouteId = routes.Id and rca.CustomerId = external_parties.Id."

time_templates:
  current_month:
    sales_flat: "sf.Date >= DATE_FORMAT(CURRENT_DATE, '%Y-%m-01') AND sf.Date < DATE_ADD(DATE_FORMAT(CURRENT_DATE, '%Y-%m-01'), INTERVAL 1 MONTH)"
    sales_targets: "st.StartDate <= LAST_DAY(CURRENT_DATE) AND st.EndDate >= DATE_FORMAT(CURRENT_DATE, '%Y-%m-01')"
  last_month:
    sales_flat: "sf.Date >= DATE_FORMAT(DATE_SUB(CURRENT_DATE, INTERVAL 1 MONTH), '%Y-%m-01') AND sf.Date < DATE_FORMAT(CURRENT_DATE, '%Y-%m-01')"
    sales_targets: "st.StartDate <= LAST_DAY(DATE_SUB(CURRENT_DATE, INTERVAL 1 MONTH)) AND st.EndDate >= DATE_FORMAT(DATE_SUB(CURRENT_DATE, INTERVAL 1 MONTH), '%Y-%m-01')"

kpis:
  net_value:
    keywords: [net sales, net value, achievement, actual sales, sales]
    definition: Net sales after deducting returns. Formula uses NetValue with Type sales minus Type return.
    grain: transaction
    tables: [sales_flat, sales_hierarchy_nodes]
    fact_table: sales_flat
    expression: "SUM(CASE WHEN sf.Type = 'sales' THEN sf.NetValue ELSE -sf.NetValue END)"
    alias: NetSales
    rls: true
  sales_value:
    keywords: [gross sales, sales amount, sales value]
    definition: Sales value of Type='sales' rows only.
    grain: transaction
    tables: [sales_flat, sales_hierarchy_nodes]
    fact_table: sales_flat
    expression: "SUM(CASE WHEN sf.Type = 'sales' THEN sf.NetValue ELSE 0 END)"
    alias: SalesValue
    rls: true
  return_value:
    keywords: [returns, return amount, return value]
    definition: Return value reported as a positive amount.
    grain: transaction
    tables: [sales_flat, sales_hierarchy_nodes]
    fact_table: sales_flat
    expression: "SUM(CASE WHEN sf.Type = 'return' THEN sf.NetValue ELSE 0 END)"
    alias: ReturnValue
    rls: true
  sales_quantity:
    keywords: [sales quantity, sales qty, sold quantity]
    definition: Quantity sold excluding returns.
    grain: transaction
    tables: [sales_flat, sales_hierarchy_nodes]
    fact_table: sales_flat
    expression: "SUM(CASE WHEN sf.Type = 'sales' THEN sf.Qty ELSE 0 END)"
    alias: SalesQty
    rls: true
  bill_count:
    keywords: [bill count, invoice count, number of bills]
    definition: Distinct invoices with positive sales.
    grain: invoice
    tables: [sales_flat, sales_hierarchy_nodes]
    fact_table: sales_flat
    expression: "COUNT(DISTINCT CASE WHEN sf.Type = 'sales' AND sf.NetValue > 0 THEN sf.InvoiceNo END)"
    alias: BillCount
    rls: true
  productive_calls:
    keywords: [productive calls, productive call, pc]
    definition: Distinct customers billed with positive sales per rep per day, then summed.
    grain: rep_day
    tables: [sales_flat, sales_hierarchy_nodes]
    fact_table: sales_flat
    expression: "COUNT(DISTINCT CASE WHEN sf.Type = 'sales' AND sf.NetValue > 0 THEN CONCAT(sf.CustomerCode, '|', CAST(sf.Date AS DATE)) END)"
    alias: ProductiveCalls
    rls: true
  target:
    keywords: [target, sales target, quota]
    definition: Rep-level target Type=1 overlapping the period.
    grain: rep_period
    tables: [sales_targets, sales_hierarchy_nodes]
    fact_table: sales_targets
    expression: "SUM(st.Value)"
    alias: SalesTarget
    extra_filter: "st.Type = 1"
    rls: true
  achievement_pct:
    keywords: [achievement percentage, target vs achievement, achievement %]
    definition: Net sales divided by target.
    grain: rep_period
    derived: true
    components: [net_value, target]
    alias: AchievementPct

dimensions:
  rep: {expr: "shn.Code", label: "shn.Name", alias_code: "RepCode", alias_name: "RepName"}
  route: {expr: "sf.Route", label: "sf.Route", alias_code: "Route", alias_name: "Route"}
  customer: {expr: "sf.CustomerCode", label: "sf.CustomerName", alias_code: "CustomerCode", alias_name: "CustomerName"}
  product: {expr: "sf.ProductCode", label: "sf.ProductName", alias_code: "ProductCode", alias_name: "ProductName"}
  brand: {expr: "sf.Brand", label: "sf.Brand", alias_code: "Brand", alias_name: "Brand"}
  date: {expr: "CAST(sf.Date AS DATE)", label: "CAST(sf.Date AS DATE)", alias_code: "SaleDate", alias_name: "SaleDate"}
